# Builds the iOS app on a GitHub-hosted Mac (free for public repositories).
# For now: a simulator build, to check that everything compiles. Signing and TestFlight
# uploads come once the Apple Developer account exists (see docs/ios.md).
name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Tools
        run: |
          brew install xcodegen ffmpeg
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Prepare sounds and generate the Xcode project
        run: |
          sh iosApp/scripts/prepare-resources.sh
          cd iosApp && xcodegen generate

      - name: Build for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "^e: |error:|warning: .*\.kt|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Report errors as annotations
        if: failure()
        run: |
          # One annotation with the first compiler errors, readable without signing in to GitHub.
          msg=$(grep -E "^e: |error:|FAILURE|What went wrong|^> " build.log | grep -v "^error: Command PhaseScriptExecution" | head -40 \
            | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg:-No compiler errors found; see the log.}"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore
