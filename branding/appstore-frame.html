<!-- Frames an App Store screenshot like the Play ones: brand gradient, white Nunito caption, the screen in a
     rounded white frame. A template: branding/frame-appstore.sh fills in the {{…}} values (sizes worked out
     from the screenshot) and renders it with headless Edge. No JavaScript: headless Edge took the picture
     before a script-built layout appeared. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; }
  body { width: {{W}}px; height: {{H}}px; position: relative; font-family: 'Nunito', sans-serif;
         background: linear-gradient(160deg, #4CC9F0, #4361EE 70%, #7B2CBF); }
  #cap { position: absolute; left: 6%; right: 6%; top: {{CAP_TOP}}px; height: {{CAP_H}}px; font-size: {{FONT}}px;
         color: #fff; font-weight: 900; text-align: center; line-height: 1.15; text-shadow: 0 4px 0 rgba(0, 0, 0, .18);
         display: flex; align-items: center; justify-content: center; }
  #frame { position: absolute; left: {{LEFT}}px; top: {{TOP}}px; width: {{FW}}px; height: {{FH}}px;
           border: {{BORDER}}px solid #fff; border-radius: {{R}}px; background: #fff; overflow: hidden;
           box-shadow: 0 18px 50px rgba(0, 0, 0, .28); }
  #frame img { display: block; width: 100%; height: 100%; border-radius: {{IR}}px; }
</style></head>
<body><div id="cap">{{CAP}}</div><div id="frame"><img src="{{IMG}}"></div></body></html>
